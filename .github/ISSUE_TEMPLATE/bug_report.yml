name: Bug report
description: Report a reproducible AgentPilot defect without private data
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not include credentials, prompts, source code, private conversations, chat IDs, or raw local stores. Report security issues privately using SECURITY.md."
  - type: input
    id: version
    attributes:
      label: AgentPilot version
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: VS Code, OS, Node, and Codex versions
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use a disposable project and sanitized values.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and sanitized error category
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, prompts, source code, private conversation text, and personal information.
          required: true
